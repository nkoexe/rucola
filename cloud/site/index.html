<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Margarine&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rucola</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F4FAF0;
      color: #2a3229;
      font: 400 20px "Margarine", system-ui, sans-serif;
      text-align: center
    }

    h1 {
      margin: 0;
      font-weight: 600;
      font-size: clamp(56px, 12vw, 120px);
    }

    p {
      margin: 20px 0;
      color: #313c2f9c
    }

    .title {
      display: flex;
      align-items: center;
    }

    .logo {
      position: relative;
      margin-top: 10px;
      --size: clamp(80px, 13vw, 150px);
    }

    .logo .bg {
      position: absolute;
      width: calc(var(--size)/1.5);
      aspect-ratio: 1;
      background: #CDE8B6;
      border-radius: 40%;
      z-index: -1;
      translate: 0 calc(var(--size)/6);
      rotate: -10deg;
    }

    .logo img {
      width: var(--size);
      image-rendering: pixelated;
    }

    .download {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 80px;
      padding: 10px 18px;
      color: #fff;
      text-decoration: none;
    }

    .download .oval {
      position: absolute;
      width: 10rem;
      height: 4rem;
      background: #344132;
      border-radius: 999px;
      z-index: -1;
      transition: all .3s cubic-bezier(0.23, 1, 0.320, 1);
    }

    .download:hover .oval {
      scale: 1.3;
      rotate: -5deg;
      background: #c34518;
    }

    .download:active .oval {
      scale: 1.2;
    }
  </style>
</head>

<body>

  <main>
    <div class="title">
      <div class="logo">
        <div class="bg"></div>
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABsAAAAaCAYAAABGiCfwAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAACJSURBVEhL7ZBBDoAwCAT7Ft/jZ32hnkjIuEDTtDcmMS1jWaxjNLu5nvvlM3NGnUtRTd5lwcqlRA3ZEKN6/yNrUJ6OdUnUoDwd6xLezvaR9yhXEoVGe6vppmCjv51fPcpN4wdyJfy4JRgQhSq3BINUTbcMw/wv5bstcNiRIYYPPzrIOH6jpmm28QE/YrHZzJSBhQAAAABJRU5ErkJggg==" />
      </div>
      <h1>rucola</h1>
    </div>

    <p>connect to your person &lt;3</p>
    <a class="download" href="https://github.com/nkoexe/rucola/releases/latest">
      <div class="oval"></div>
      <span>Download</span>
    </a>
  </main>
</body>

</html>
