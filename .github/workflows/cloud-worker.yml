name: Cloud Worker

on:
  push:
    branches:
      - "**"
    paths:
      - "cloud/worker/**"
      - "cloud/site/**"
      - ".github/workflows/cloud-worker.yml"
      - ".gitattributes"

permissions:
  contents: read

concurrency:
  group: cloud-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.x
          cache: npm
          cache-dependency-path: cloud/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Run tests
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm test
