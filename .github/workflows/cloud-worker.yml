name: Cloud Worker

on:
  push:
    paths:
      - "cloud/worker/**"
      - ".github/workflows/cloud-worker.yml"
  pull_request:
    paths:
      - "cloud/worker/**"
      - ".github/workflows/cloud-worker.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
