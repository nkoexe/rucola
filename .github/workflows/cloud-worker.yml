name: Cloud Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloud/worker/**"
      - ".github/workflows/cloud-worker.yml"
      - ".gitattributes"
  pull_request:
    branches: [main]
    paths:
      - "cloud/worker/**"
      - ".github/workflows/cloud-worker.yml"
      - ".gitattributes"
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to deploy
        required: true
        type: choice
        options:
          - dev
          - production

permissions:
  contents: read

concurrency:
  group: cloud-worker-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.x
          cache: npm
          cache-dependency-path: cloud/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Run tests
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm test

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.x
          cache: npm
          cache-dependency-path: cloud/worker/package-lock.json
      - run: npm ci
      - name: Render Cloudflare deployment config
        env:
          RUCOLA_DEPLOY_ENV: dev
          RUCOLA_D1_DATABASE_ID: ${{ secrets.RUCOLA_D1_DATABASE_ID }}
        run: npm run render:deploy-config
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply rucola-dev --remote --config .wrangler.deploy.jsonc
      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config .wrangler.deploy.jsonc --strict

  deploy-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.x
          cache: npm
          cache-dependency-path: cloud/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Run tests
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm test
      - name: Render Cloudflare deployment config
        env:
          RUCOLA_DEPLOY_ENV: ${{ inputs.environment }}
          RUCOLA_D1_DATABASE_ID: ${{ secrets.RUCOLA_D1_DATABASE_ID }}
        run: npm run render:deploy-config
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUCOLA_DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          if [[ "$RUCOLA_DEPLOY_ENV" == "dev" ]]; then
            DATABASE_NAME="rucola-dev"
          else
            DATABASE_NAME="rucola-prod"
          fi
          npx wrangler d1 migrations apply "$DATABASE_NAME" --remote --config .wrangler.deploy.jsonc
      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config .wrangler.deploy.jsonc --strict
