name: Android

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK_VERSION: '27.1.12297006'
  ANDROID_CMDLINE_TOOLS_VERSION: '14742923'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:domain
      - run: npm run test:cloud-client
      - run: npm run test:crypto
      - run: npm run test:sync-engine
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v6
        id: android-sdk-cache
        with:
          path: ${{ github.workspace }}/.android-sdk
          key: android-sdk-${{ runner.os }}-api${{ env.ANDROID_API_LEVEL }}-build${{ env.ANDROID_BUILD_TOOLS }}-ndk${{ env.ANDROID_NDK_VERSION }}-cmdline${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}-v4
      - uses: android-actions/setup-android@v4
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
          ANDROID_HOME: ${{ github.workspace }}/.android-sdk
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
      - name: Verify Android SDK components
        run: |
          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API_LEVEL}"
          test -d "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          test -d "$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
      - name: Create Android debug keystore
        working-directory: android
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -storetype JKS \
              -keystore app/debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - uses: gradle/actions/setup-gradle@v5
      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: rucola-development-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
