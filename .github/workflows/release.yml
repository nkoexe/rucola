name: Android Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm
      - run: npm ci

      - name: Validate release source
        run: |
          npm run typecheck
          npm run test:domain
          npm run test:cloud-client
          npm run test:sync-engine

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Create Android debug keystore
        working-directory: android
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -storetype JKS \
              -keystore app/debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: android
        run: bash ./gradlew assembleRelease

      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "rucola-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "rucola-${GITHUB_REF_NAME}.apk" \
            --title "Rucola $GITHUB_REF_NAME" \
            --generate-notes
