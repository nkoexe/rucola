name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  ANDROID_KEYSTORE_PATH: android/app/rucola-release.keystore
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            echo "Expected vMAJOR.MINOR.PATCH or a semver prerelease suffix."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm
      - run: npm ci

      - name: Validate release source
        run: |
          npm run typecheck
          npm run test:domain
          npm run test:cloud-client
          npm run test:sync-engine

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: actions/cache@v4
        id: android-sdk-cache
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-${{ env.ANDROID_API_LEVEL }}
            ${{ env.ANDROID_HOME }}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
          key: android-sdk-${{ runner.os }}-api${{ env.ANDROID_API_LEVEL }}-build${{ env.ANDROID_BUILD_TOOLS }}-v1

      - name: Install Android SDK components
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - run: yes | sdkmanager --licenses >/dev/null || true

      - name: Verify Android SDK components
        run: |
          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API_LEVEL}"
          test -d "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: Restore release keystore
        env:
          RUCOLA_RELEASE_KEYSTORE_BASE64: ${{ secrets.RUCOLA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RUCOLA_RELEASE_KEYSTORE_BASE64"
          mkdir -p "$(dirname "$ANDROID_KEYSTORE_PATH")"
          printf '%s' "$RUCOLA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Prepare Android version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_NAME="${RELEASE_TAG#v}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version name derived from tag: $VERSION_NAME" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid GitHub Actions run number: $RELEASE_RUN_NUMBER" >&2
            exit 1
          fi
          {
            echo "RUCOLA_VERSION_NAME=$VERSION_NAME"
            echo "RUCOLA_VERSION_CODE=$RELEASE_RUN_NUMBER"
          } >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        working-directory: android
        env:
          RUCOLA_RELEASE_SIGNING: 'true'
          RUCOLA_RELEASE_KEYSTORE_FILE: rucola-release.keystore
          RUCOLA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RUCOLA_RELEASE_KEYSTORE_PASSWORD }}
          RUCOLA_RELEASE_KEY_ALIAS: ${{ secrets.RUCOLA_RELEASE_KEY_ALIAS }}
          RUCOLA_RELEASE_KEY_PASSWORD: ${{ secrets.RUCOLA_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RUCOLA_RELEASE_KEYSTORE_PASSWORD"
          test -n "$RUCOLA_RELEASE_KEY_ALIAS"
          test -n "$RUCOLA_RELEASE_KEY_PASSWORD"
          echo "Building Android version $RUCOLA_VERSION_NAME (code $RUCOLA_VERSION_CODE)"
          bash ./gradlew assembleRelease

      - name: Prepare release APK
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "rucola-${RELEASE_TAG}.apk"

      - name: Verify APK
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          test -s "rucola-${RELEASE_TAG}.apk"
          apksigner verify --verbose "rucola-${RELEASE_TAG}.apk"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "rucola-${RELEASE_TAG}.apk" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "rucola-${RELEASE_TAG}.apk" \
              --title "Rucola $RELEASE_TAG" \
              --generate-notes
          fi
