name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  ANDROID_KEYSTORE_PATH: android/app/rucola-release.keystore

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            echo "Expected vMAJOR.MINOR.PATCH or a semver prerelease suffix."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm
      - run: npm ci

      - name: Validate release source
        run: |
          npm run typecheck
          npm run test:domain
          npm run test:cloud-client
          npm run test:sync-engine

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          RUCOLA_RELEASE_KEYSTORE_BASE64: ${{ secrets.RUCOLA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RUCOLA_RELEASE_KEYSTORE_BASE64"
          mkdir -p "$(dirname "$ANDROID_KEYSTORE_PATH")"
          printf '%s' "$RUCOLA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        working-directory: android
        env:
          RUCOLA_RELEASE_SIGNING: 'true'
          RUCOLA_RELEASE_KEYSTORE_FILE: app/rucola-release.keystore
          RUCOLA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RUCOLA_RELEASE_KEYSTORE_PASSWORD }}
          RUCOLA_RELEASE_KEY_ALIAS: ${{ secrets.RUCOLA_RELEASE_KEY_ALIAS }}
          RUCOLA_RELEASE_KEY_PASSWORD: ${{ secrets.RUCOLA_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RUCOLA_RELEASE_KEYSTORE_PASSWORD"
          test -n "$RUCOLA_RELEASE_KEY_ALIAS"
          test -n "$RUCOLA_RELEASE_KEY_PASSWORD"
          bash ./gradlew assembleRelease

      - name: Prepare release APK
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "rucola-${RELEASE_TAG}.apk"

      - name: Verify APK
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          test -s "rucola-${RELEASE_TAG}.apk"
          apksigner verify --verbose "rucola-${RELEASE_TAG}.apk"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "rucola-${RELEASE_TAG}.apk" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "rucola-${RELEASE_TAG}.apk" \
              --title "Rucola $RELEASE_TAG" \
              --generate-notes
          fi
