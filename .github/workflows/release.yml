name: Android Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_KEYSTORE_PATH: android/app/rucola-release.keystore

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm
      - run: npm ci

      - name: Validate release source
        run: |
          npm run typecheck
          npm run test:domain
          npm run test:cloud-client
          npm run test:sync-engine

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          RUCOLA_RELEASE_KEYSTORE_BASE64: ${{ secrets.RUCOLA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RUCOLA_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RUCOLA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        working-directory: android
        env:
          RUCOLA_RELEASE_SIGNING: 'true'
          RUCOLA_RELEASE_KEYSTORE_FILE: rucola-release.keystore
          RUCOLA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RUCOLA_RELEASE_KEYSTORE_PASSWORD }}
          RUCOLA_RELEASE_KEY_ALIAS: ${{ secrets.RUCOLA_RELEASE_KEY_ALIAS }}
          RUCOLA_RELEASE_KEY_PASSWORD: ${{ secrets.RUCOLA_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RUCOLA_RELEASE_KEYSTORE_PASSWORD"
          test -n "$RUCOLA_RELEASE_KEY_ALIAS"
          test -n "$RUCOLA_RELEASE_KEY_PASSWORD"
          bash ./gradlew assembleRelease

      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "rucola-${GITHUB_REF_NAME}.apk"

      - name: Verify APK
        run: |
          test -s "rucola-${GITHUB_REF_NAME}.apk"
          apksigner verify --verbose "rucola-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "rucola-${GITHUB_REF_NAME}.apk" \
            --title "Rucola $GITHUB_REF_NAME" \
            --generate-notes
